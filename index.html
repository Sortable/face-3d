<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khuôn mặt 3D</title>
<style>
  :root { --accent:#5eead4; --text:#e8eefc; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 50% 20%, #101a33, #070b18 70%);
    color: var(--text);
    overflow: hidden;
  }
  #c { position:fixed; inset:0; display:block; }
  #ui {
    position:fixed; top:24px; left:50%; transform:translateX(-50%);
    text-align:center; z-index:10; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  #ui h1 { font-size:22px; font-weight:600; letter-spacing:.5px; }
  #ui p { font-size:13px; opacity:.65; }
  #buttons { display:flex; gap:8px; pointer-events:auto; }
  #buttons button {
    border:1px solid rgba(94,234,212,.35);
    background:rgba(15,23,42,.6); color:var(--text);
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer;
    backdrop-filter: blur(6px); transition: all .15s;
  }
  #buttons button:hover { background:rgba(94,234,212,.15); }
  #buttons button.active { background:rgba(94,234,212,.9); color:#04121b; border-color:transparent; }
  #status { font-size:13px; color:#fda4af; min-height:18px; }
  #fallback {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:#0a0e1a; z-index:20; flex-direction:column; gap:16px; text-align:center; padding:24px;
  }
  #fallback img { max-width:70vw; max-height:70vh; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #fallback p { font-size:13px; opacity:.6; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Khuôn mặt 3D</h1>
  <p>Kéo chuột để xoay &nbsp;·&nbsp; lăn để phóng to / thu nhỏ</p>
  <div id="buttons">
    <button id="btnPhoto" class="active">Ảnh 3D</button>
    <button id="btnMesh">Lưới khuôn mặt 3D</button>
  </div>
  <div id="status"></div>
</div>
<div id="fallback">
  <img id="fallbackImg" alt="khuôn mặt">
  <p>Không tải được thư viện 3D (cần internet). Đang hiển thị ảnh tĩnh.</p>
</div>

document.getElementById('fallbackImg').src = IMG_SRC;

const canvas = document.getElementById('c');
const statusEl = document.getElementById('status');
const btnPhoto = document.getElementById('btnPhoto');
const btnMesh = document.getElementById('btnMesh');

let THREE;
let renderer, scene, camera, controls, currentGroup, texture;
let photoMode = true;
let landmarker = null;

function setStatus(s){ statusEl.textContent = s || ''; }
function setActive(btn){ btnPhoto.classList.toggle('active', btn === btnPhoto); btnMesh.classList.toggle('active', btn === btnMesh); }

function clearGroup(){
  while(currentGroup.children.length){
    const o = currentGroup.children[0];
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      if(Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
    currentGroup.remove(o);
  }
}

function showPhoto(){
  setActive(btnPhoto);
  photoMode = true;
  clearGroup();
  const iw = texture && texture.image ? texture.image.width : 1000;
  const ih = texture && texture.image ? texture.image.height : 1000;
  const aspect = iw / ih;
  const w = Math.min(aspect * 2, 2.6);
  const h = w / aspect;
  const geo = new THREE.PlaneGeometry(w, h);
  const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.55, metalness: 0.02, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  currentGroup.add(mesh);
  const frame = new THREE.Mesh(
    new THREE.PlaneGeometry(w + 0.09, h + 0.09),
    new THREE.MeshBasicMaterial({ color: 0x24314f, side: THREE.DoubleSide })
  );
  frame.position.z = -0.01;
  currentGroup.add(frame);
  setStatus('');
}

function buildLines(pos){
  const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
  const R_EYE = [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
  const L_EYE = [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];
  const R_BROW = [70,63,105,66,107,55,65,52,53,46];
  const L_BROW = [336,296,334,293,300,276,283,282,295,285];
  const LIPS = [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185];
  const NOSE = [168,6,197,195,5,4,1,19,94,2,164];

  const pairs = [];
  function loop(arr){ for(let i = 0; i < arr.length - 1; i++){ pairs.push(arr[i], arr[i+1]); } pairs.push(arr[arr.length-1], arr[0]); }
  loop(FACE_OVAL); loop(R_EYE); loop(L_EYE); loop(R_BROW); loop(L_BROW); loop(LIPS);
  for(let i = 0; i < NOSE.length - 1; i++) pairs.push(NOSE[i], NOSE[i+1]);

  const idx = new Uint16Array(pairs);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  const mat = new THREE.LineBasicMaterial({ color: 0x5eead4, transparent: true, opacity: 0.9 });
  return new THREE.LineSegments(geo, mat);
}

function buildFaceMesh(lms){
  clearGroup();
  const pts = lms.map(p => ({ x: p.x - 0.5, y: -(p.y - 0.5), z: (p.z || 0) }));
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for(const p of pts){
    if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
    if(p.y < minY) minY = p.y; if(p.y > maxY) maxY = p.y;
    if(p.z < minZ) minZ = p.z; if(p.z > maxZ) maxZ = p.z;
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
  const span = Math.max(maxX - minX, maxY - minY) || 1;
  const S = 2.4 / span;
  const pos = new Float32Array(pts.length * 3);
  for(let i = 0; i < pts.length; i++){
    pos[i*3]   = (pts[i].x - cx) * S;
    pos[i*3+1] = (pts[i].y - cy) * S;
    pos[i*3+2] = (pts[i].z - cz) * S * 1.6;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  const points = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x7dd3fc, size: 0.02, sizeAttenuation: true }));
  currentGroup.add(points);
  currentGroup.add(buildLines(pos));
  setStatus('');
}

async function showFaceMesh(){
  setActive(btnMesh);
  photoMode = false;
  clearGroup();
  setStatus('Đang nhận diện khuôn mặt…');
  try {
    if(!landmarker){
      if(!window.FaceLandmarker || !window.FilesetResolver) throw new Error('no-mediapipe');
      const resolver = await window.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      landmarker = await window.FaceLandmarker.createFromOptions(resolver, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'CPU'
        },
        runningMode: 'IMAGE',
        numFaces: 1
      });
    }
    const img = new Image();
    img.onload = () => {
      const res = landmarker.detect(img);
      if(!res.faceLandmarks || !res.faceLandmarks.length){
        setStatus('Không tìm thấy khuôn mặt trong ảnh.');
        return;
      }
      buildFaceMesh(res.faceLandmarks[0]);
    };
    img.onerror = () => setStatus('Không đọc được ảnh.');
    img.src = IMG_SRC;
  } catch(e){
    setStatus('Không tải được MediaPipe — cần internet để chạy chế độ này.');
  }
}

function onResize(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

async function boot(){
  try {
    THREE = await import('three');
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0, 3.4);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.4;
    controls.minDistance = 1.2;
    controls.maxDistance = 8;

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const key = new THREE.DirectionalLight(0xffffff, 1.4);
    key.position.set(2, 3, 4);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x5eead4, 0.8);
    rim.position.set(-3, -1, -2);
    scene.add(rim);

    currentGroup = new THREE.Group();
    scene.add(currentGroup);

    texture = new THREE.TextureLoader().load(IMG_SRC, (t) => {
      t.colorSpace = THREE.SRGBColorSpace;
      if(photoMode) showPhoto();
    });

    window.addEventListener('resize', onResize);
    animate();
    showPhoto();
  } catch(e){
    document.getElementById('fallback').style.display = 'flex';
  }
}

btnPhoto.addEventListener('click', showPhoto);
btnMesh.addEventListener('click', showFaceMesh);
boot();
</script>
</body>
</html>
